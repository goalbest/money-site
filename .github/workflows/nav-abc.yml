name: ABC NAV Update

"on":
  schedule:
    - cron: '0 0,4,8,12 * * *'   # 北京时间 8/12/16/20
  workflow_dispatch:

jobs:
  abc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: 农银理财净值更新
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node crawler/fetch_abc.mjs