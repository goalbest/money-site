name: Pending Holdings Update

"on":
  schedule:
    # 每天 4 次：北京时间 8:00 / 12:00 / 16:00 / 20:00
    - cron: '0 0,4,8,12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: 在途持仓状态切换
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node crawler/update_pending_holdings.mjs